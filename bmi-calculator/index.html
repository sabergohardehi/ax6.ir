<!DOCTYPE html>
<html lang="en" data-title-key="title.bmi-calculator">
<head>
  <meta charset="UTF-8" />
  <script>
    (function(){try{var m=document.cookie.match(/(?:^|; )ax6=([^;]*)/);if(!m)return;var j=JSON.parse(decodeURIComponent(m[1]));var h=document.documentElement;if(j.t==="light")h.setAttribute("data-theme","light");if(j.l==="fa"){h.lang="fa";h.dir="rtl";}}catch(e){}})();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Calculate BMI in metric or imperial units - free tool by ax6.ir" />
  <title>BMI Calculator - ax6.ir</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tool.css" />
  <link rel="stylesheet" href="../css/prefs.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div class="page">
    <header class="topbar">
      <a class="back-link" href="../" data-i18n="nav.back">← All tools</a>
      <h1 data-i18n="tool.bmi-calculator.name">BMI Calculator</h1>
      <p class="subtitle" data-i18n="tool.bmi-calculator.sub">Body mass index from height and weight. For information only - not medical advice.</p>
    </header>
    <main class="card stack">
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-unit="metric" aria-selected="true" data-i18n="bmi.metric">Metric</button>
        <button type="button" class="tab" data-unit="imperial" aria-selected="false" data-i18n="bmi.imperial">Imperial</button>
      </div>
      <div id="metric-fields" class="stack">
        <div class="field"><label for="cm" data-i18n="bmi.heightCm">Height (cm)</label><input type="number" id="cm" min="50" max="250" step="0.1" /></div>
        <div class="field"><label for="kg" data-i18n="bmi.weightKg">Weight (kg)</label><input type="number" id="kg" min="20" max="300" step="0.1" /></div>
      </div>
      <div id="imperial-fields" class="stack hidden">
        <div class="field"><label for="ft" data-i18n="bmi.heightFt">Height (ft)</label><input type="number" id="ft" min="3" max="8" step="1" /></div>
        <div class="field"><label for="inch" data-i18n="bmi.heightIn">Height (in)</label><input type="number" id="inch" min="0" max="11" step="0.1" /></div>
        <div class="field"><label for="lb" data-i18n="bmi.weightLb">Weight (lb)</label><input type="number" id="lb" min="40" max="700" step="0.1" /></div>
      </div>
      <div class="actions"><button type="button" id="calc" class="btn btn-primary" data-i18n="bmi.calculate">Calculate</button></div>
      <div id="result" class="result" hidden></div>
    </main>
  </div>
  <script src="../js/i18n.js"></script>
  <script src="../js/prefs.js"></script>
  <script src="../js/tool-common.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
