<!DOCTYPE html>
<html lang="en" data-title-key="title.case-converter">
<head>
  <meta charset="UTF-8" />
  <script>(function(){try{var m=document.cookie.match(/(?:^|; )ax6=([^;]*)/);if(!m)return;var j=JSON.parse(decodeURIComponent(m[1]));var h=document.documentElement;if(j.t==="light")h.setAttribute("data-theme","light");if(j.l==="fa"){h.lang="fa";h.dir="rtl";}}catch(e){}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      <div class="field">

        <textarea id="output" readonly></textarea>
